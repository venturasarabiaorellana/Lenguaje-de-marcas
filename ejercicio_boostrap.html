<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 1 - Uso de la rejilla</title>

    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .verde { background-color: #00ff00; }
        .rojo  { background-color: #ff0000; }
        .azul  { background-color: #0000ff; }

        .caja  { height: 60px; }
    </style>
</head>
<body>

    <main class="container my-5">

        <h2 class="mb-3">Ejercicio 1 - Uso de la rejilla</h2>

        <!-- Fila 1: bloque rojo a todo el ancho en cualquier tamaño -->
        <div class="row g-2">
            <div class="col-12">
                <div class="rojo caja"></div>
            </div>
        </div>

        <!-- Fila 2: xs apilado | sm en adelante: 3 + 9, con hueco entre azul y verde -->
        <div class="row g-2">
            <div class="col-12 col-sm-3">
                <div class="azul caja"></div>
            </div>
            <div class="col-12 col-sm-9">
                <div class="verde caja"></div>
            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 Mi Web</p>
    </footer>

    <!-- Bootstrap 5.3.8 JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
