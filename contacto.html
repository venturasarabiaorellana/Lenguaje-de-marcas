<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | LOS CICLOPES</title>

    <!-- Bootstrap 5: hoja de estilos que da diseño a la web -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Fondo morado degradado de toda la página */
        body {
            background: radial-gradient(circle at top, #3b0a4f 0%, #1a0628 55%, #000000 100%);
            color: #ffb347;
            min-height: 100vh;
        }

        /* Cambia el color de la barra de navegación a naranja */
        .navbar.bg-primary {
            background-color: #ff6a00 !important;
        }

        .bg-dark {
            background-color: #0d0014 !important;
        }

        /* Color amarillo para el título y las etiquetas del formulario */
        h1, .form-label {
            color: #ffd23f;
        }

        /* Estilo de las cajas donde se escribe */
        .form-control {
            background-color: #2a0b3d;
            color: #f3e5ff;
            border-color: #ff6a00;
        }

        /* Color del texto de ejemplo dentro de las cajas */
        .form-control::placeholder {
            color: #b38fd1;
        }

        /* Lo que cambia cuando el usuario hace clic en una caja */
        .form-control:focus {
            background-color: #3b0a4f;
            color: #f3e5ff;
            border-color: #9dff2e;
            box-shadow: 0 0 0 0.25rem rgba(157, 255, 46, 0.25);
        }

        /* Estilo del botón Enviar */
        .btn-primary {
            background-color: #ff6a00;
            border-color: #ff6a00;
            color: #000000;
        }

        /* Lo que cambia cuando pasas el ratón por encima del botón */
        .btn-primary:hover {
            background-color: #ffd23f;
            border-color: #ffd23f;
            color: #000000;
        }
    </style>
</head>
<body>

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="index.html">CICLOPES</a>

        <!-- Botón hamburguesa: abre el menú en móviles -->
        <button class="navbar-toggler" type="button"
            data-bs-toggle="collapse"
            data-bs-target="#menuPrincipal"
            aria-controls="menuPrincipal"
            aria-expanded="false"
            aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>

            <!-- Lista de enlaces del menú -->
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Conoce a los ciclopes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="galeria.html">Evidencias Fotográficas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="contacto.html">Informar sobre un avistamiento</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- FORMULARIO DE CONTACTO -->
    <div class="container mt-4">
        <h1>Contacta con nosotros</h1>

        <!-- form: caja que agrupa los campos. Todavía no envía nada a ningún sitio -->
        <form class="mt-4">
            <!-- Campo de texto para el nombre -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
            </div>

            <!-- Campo de correo: type="email" comprueba que se escriba un correo válido -->
            <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="tucorreo@ejemplo.com">
            </div>

            <!-- Caja de texto grande para describir el avistamiento -->
            <div class="mb-3">
                <label for="mensaje" class="form-label">Describe el avistamiento brevemente</label>
                <textarea class="form-control" id="mensaje" rows="4"></textarea>
            </div>

            <!-- Botón que envía el formulario (type="submit") -->
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
    </div>

    <!-- Imagen de los cíclopes, centrada. Ocupa el 40% del ancho -->
<div class="text-center">
    <img src="ciclope.png" class="img-fluid mb-4" alt="ciclopes" style="width: 40%; max-height: 1000px; object-fit: cover;">
</div>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 LOS CICLOPES</p>
    </footer>

    <!-- JavaScript de Bootstrap: necesario para el menú hamburguesa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
